# Pretraining ablation (review E1): same Hiera-Tiny encoder + FPN decoder as
# sam2_seg_tiny, but the encoder is randomly initialised -- only the
# architecture config is read from the Hub, no SAM2 weights.
_target_: src.models.sam2_seg.SAM2SegNet
in_channels: ${in_channels}   # must be 3
out_channels: ${out_channels}
checkpoint: facebook/sam2.1-hiera-tiny
decoder_channels: 128
freeze_encoder: false
img_size: null
normalize: null
pretrained: false
